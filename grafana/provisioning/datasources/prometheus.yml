apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned on purpose. Grafana generates a random uid when this is absent, and
    # the dashboard in ../dashboards/ refers to the datasource by uid. Without a
    # pinned uid the dashboard would only work on the volume that happened to be
    # created first. It is the uid this datasource already has, so pinning it
    # changes nothing on the running stack and a fresh volume reproduces it.
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Matches the wht_tbm scrape_interval in prometheus.yml.
      timeInterval: 5m
