apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned on purpose. Grafana generates a random uid when this is absent, and
    # the dashboards in ../dashboards/ refer to the datasource by uid. Without a
    # pinned uid a dashboard would only work on the volume that happened to be
    # created first. It is the uid this datasource already has, so pinning it
    # changes nothing on the running stack and a fresh volume reproduces it.
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # The assumed sample interval Grafana uses to size its resolution and
      # $__rate_interval, and the default min step. It matches the wht_tbm
      # scrape_interval, NOT snowy_tantangara, which is scraped hourly.
      #
      # That mismatch is harmless for these dashboards: no query here uses a
      # rate() or an irate(), so $__rate_interval never appears and a plain
      # selector does not care what the step is. It is also why the TBM
      # dashboard's advance-rate and ETA panels use $__range_s rather than
      # $__rate_interval: the latter is clamped to this 5m and would make both
      # a constant 5-minute rate. See NOTES.md section 7. The one place it could
      # bite is $__interval on a range query over the hourly job, which would
      # ask for 5m resolution against 1h data. Keep this at 5m and leave range
      # queries on the reservoir series with an explicit range, as they are.
      timeInterval: 5m
