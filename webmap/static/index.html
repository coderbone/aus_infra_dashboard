<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEM map</title>
<link rel="stylesheet" href="/static/lib/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="map"></div>

<div id="header">
  <div id="title">NEM map</div>
  <div id="status"><span id="st-time">–</span> <span id="st-prom">–</span></div>
</div>

<div id="panel">
  <label class="opt">Region fill
    <select id="region-metric">
      <option value="stored" selected>Battery stored MWh</option>
      <option value="fossil">Fossil generation MW</option>
      <option value="curtail">Curtailment MW</option>
      <option value="none">Off</option>
    </select>
  </label>
  <label class="opt chk"><input type="checkbox" id="tog-schematic" checked> schematic lines</label>
  <label class="opt chk"><input type="checkbox" id="tog-idle" checked> show idle</label>

  <div class="opt-group">
    <div class="opt-group-title">Fuel type</div>
    <label class="opt chk"><input type="checkbox" id="tog-batteries" checked> batteries</label>
    <label class="opt chk"><input type="checkbox" id="tog-solar" checked> solar</label>
    <label class="opt chk"><input type="checkbox" id="tog-wind" checked> wind</label>
    <label class="opt chk"><input type="checkbox" id="tog-hydro" checked> hydro</label>
    <label class="opt chk"><input type="checkbox" id="tog-coal" checked> coal</label>
    <label class="opt chk"><input type="checkbox" id="tog-gas" checked> gas</label>
    <label class="opt chk"><input type="checkbox" id="tog-distillate" checked> distillate</label>
  </div>

  <div class="opt-group">
    <div class="opt-group-title">Status</div>
    <label class="opt chk"><input type="checkbox" id="tog-status-operating" checked> operating</label>
    <label class="opt chk"><input type="checkbox" id="tog-status-operational" checked> operational</label>
    <label class="opt chk"><input type="checkbox" id="tog-status-commissioning" checked> commissioning</label>
    <label class="opt chk"><input type="checkbox" id="tog-status-committed" checked> committed</label>
  </div>

  <div id="gfx-scale">
    <div class="gfx-row"><span>Scale</span><span id="gfx-val">1.0</span></div>
    <input id="gfx-slider" type="range" min="0.5" max="10.0" step="0.1" value="1.0">
  </div>
  <button id="play-24h">Play 24h</button>
</div>
<div id="legend"></div>

<div id="resv" hidden>
  <h4>Snowy reservoirs</h4>
  <div id="resv-rows"></div>
  <div class="cap" id="resv-cap">% full, of gross storage &middot; arrow = 7-day change</div>
</div>

<script src="/static/lib/leaflet/leaflet.js"></script>
<script src="/static/model.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
