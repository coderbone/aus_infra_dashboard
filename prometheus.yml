global:
  scrape_interval: 1m
  evaluation_interval: 1m

scrape_configs:
  - job_name: wht_tbm
    # The upstream only publishes a survey line every few hours; 5m is cheap and
    # keeps the first-scrape jitter short (a 60m interval can leave the target in
    # state "unknown" for up to an hour after a Prometheus restart).
    scrape_interval: 5m
    scrape_timeout: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ['tbm-exporter:9109']

  - job_name: snowy_tantangara
    # Snowy Hydro publishes these levels once a day, around 07:00 Sydney time,
    # so there is nothing to gain from a short interval - 1h is 24 chances to
    # see each new reading, and it keeps the ~190 KB two-year fetch to a
    # negligible 4.5 MB/day. Still well under the first-scrape jitter concern
    # that motivates the 5m above, which only bites at an hour or more.
    scrape_interval: 1h
    scrape_timeout: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ['reservoir-exporter:9110']

  - job_name: openelectricity_battery
    # 5m is not polling the API - the exporter answers from its last completed
    # hourly cycle, so this scrape costs the upstream nothing. It is here so
    # the *value* is in Prometheus promptly after a poll finishes, and so the
    # target's freshness is visible in the UI: `time() - oe_last_poll_timestamp_seconds`
    # is the panel that tells you the poll loop has stopped. A 1h interval
    # would only be a reason to miss the failure by up to an hour.
    scrape_interval: 5m
    scrape_timeout: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ['battery-exporter:9111']

  - job_name: aemo_battery
    # Next-day data published once a day, so the *value* only steps daily - but
    # 5m is still right, for the same reason as openelectricity_battery: the
    # exporter answers from its last completed cycle (a download cannot fit a
    # 30s scrape), and 5m makes the poll's freshness visible in the UI instead
    # of hiding a stopped poll loop for an hour. Each unchanged poll costs one
    # ~90 KB listing; the ~126 MB zip is downloaded only when it actually
    # changes. A daily scrape would drag the value's defect (next-day freshness)
    # into the monitoring of the poll itself.
    scrape_interval: 5m
    scrape_timeout: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ['aemobattery-exporter:9112']
