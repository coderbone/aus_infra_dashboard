# Grafana dashboard provider.
#
# Every *.json in this directory is loaded into Grafana at boot and re-synced
# every updateIntervalSeconds. The dashboards are also served straight from the
# bind mount, so a dashboard file is read-only as far as Grafana is concerned
# and the files in git are the source of truth.
#
# allowUiUpdates: true lets a dashboard be saved from the UI. The file still
# wins once the file itself changes - a sync that sees a modified file
# overwrites the UI copy. A UI save made while the file is unchanged survives,
# so edit in whichever place suits you; see NOTES.md section 7 for pulling a
# UI-edited dashboard back into git.
#
# Dashboards here, and the uids that identify them. The uid is how provisioning
# matches a file to an existing dashboard, so a changed uid creates a duplicate
# rather than updating in place:
#
#   western-harbour-tbm.json  adr468z            WHT TBM progress
#   snowy-tantangara.json     snowy-tantangara   Snowy reservoir levels
#   battery-state-of-charge.json nembattery-soc  NEM battery state of charge
#   host-metrics.json         host-metrics       Host system metrics
#   interconnectors.json      interconnectors    NEM interconnector flows
#
# All five are written with indent=2, sort_keys=True to match the committed
# files; see NOTES.md section 7. Two are not hand-edited:
# battery-state-of-charge.json is written by tools/build_battery_dashboard.py
# and interconnectors.json by tools/build_interconnector_dashboard.py, so a
# change belongs in the builder and a re-run keeps the rest of the file
# byte-identical (both builders' suites fail if the two disagree).
apiVersion: 1

providers:
  - name: default
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
