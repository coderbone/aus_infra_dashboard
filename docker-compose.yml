# WHTP2 TBM tracker + Snowy Hydro reservoir levels + Prometheus + Grafana.
#
#   docker compose up -d         start everything (first pull of python:3.12-alpine)
#   docker compose logs -f tbm-exporter
#   docker compose down          stop (named volumes keep the TSDB and Grafana state)
#
# Requires the Compose v2 plugin (`docker compose`); the v1 python
# docker-compose cannot reconcile containers on current Docker engines.
#
# Stack layout, verify commands, and a log of problems hit here and their fixes:
# README.md and NOTES.md next to this file. Scraper internals and the upstream
# ArcGIS item ids: scrapers/README.md and scrapers/NOTES.md.
#
# `name:` below is load-bearing, and it is the compose *project* name - the
# prefix Docker puts on the network and on any volume that is not `external`.
# Unpinned it would follow this directory's name, `monitoring`, which is neither
# what the stack is nor what the repo is called. It was `bone` until 2026-09-29,
# inherited from when the stack lived directly in ~; renaming it to the repo name
# is the same hazard the pin exists to prevent, so NOTES.md section 2 has the
# order of operations for doing it again. Short version: `docker compose -p <old>
# down` *before* editing, or the pinned container_names below collide.
#
# The exporter is a stdlib-only Python script, so it runs in the official python
# image with the script bind-mounted from ./scrapers. It binds 0.0.0.0:9109 so
# Prometheus can reach it over the compose network - do NOT put it back on
# 127.0.0.1, that only works while Prometheus shares the host network namespace.
#
# There are now four exporters on the same pattern: `tbm-exporter` (Western
# Harbour Tunnel, 9109), `reservoir-exporter` (Snowy Hydro reservoir levels,
# 9110), `battery-exporter` (OpenElectricity NEM battery state of charge,
# 9111) and `aemobattery-exporter` (AEMO NEMWEB next-day dispatch battery
# energy storage, 9112). They are separate services rather than one container
# running all of them because they have nothing to share: different upstreams,
# different retry and health semantics, and separate failure isolation. Note
# the naming asymmetry - the service is short (`tbm-exporter`) and the
# container is spelled out (`wht-tbm-exporter`). All container_names are pinned
# outright, NOT derived from the project name, which is why renaming the
# project leaves them alone and why a second stack cannot run alongside this
# one under any name.

name: aus_infra_dashboard

services:
  tbm-exporter:
    image: python:3.12-alpine
    container_name: wht-tbm-exporter
    command:
      - python
      - /app/wht_tbm_exporter.py
      - --listen-address=0.0.0.0
      - --port=9109
      - --cache-file=/cache/config.json
      - --cache-ttl=60
      - --retries=3
      - --retry-budget=6
    # Docker's embedded resolver (127.0.0.11 -> systemd-resolved) intermittently
    # gives up on the ArcGIS hosts with EAI_AGAIN, and when it does it burns a
    # full 5s before failing. Measured during a live failure window: default
    # resolver 2/130 lookups failed at ~5005ms each, while 1.1.1.1 and 9.9.9.9
    # had 0/141 and 0/147. That 5s cliff is what ate the retry budget, so point
    # the container at public resolvers. --retry-budget stays as a backstop.
    dns:
      - 1.1.1.1
      - 9.9.9.9
    volumes:
      - ./scrapers/wht_tbm_exporter.py:/app/wht_tbm_exporter.py:ro
      - exporter-cache:/cache
    networks: [monitoring]
    restart: unless-stopped
    # TCP probe only: /healthz triggers a real upstream scrape, so probing it
    # every 30s would hit caportal.com.au far more often than needed.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 9109), 3).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  reservoir-exporter:
    image: python:3.12-alpine
    container_name: snowy-tantangara-exporter
    command:
      - python
      - /app/snowy_tantangara_exporter.py
      - --listen-address=0.0.0.0
      - --port=9110
      - --cache-ttl=900
      - --retries=3
      - --retry-budget=6
    # Same resolver override as tbm-exporter, for the same reason: Docker's
    # embedded resolver intermittently gives up with EAI_AGAIN and burns ~5s
    # doing it, which is what eats the retry budget. This one talks to
    # snowyhydro.com.au rather than ArcGIS, so the measurement in the comment
    # above was not taken against this host - but the fault is in the resolver,
    # not the destination, so the fix transfers.
    dns:
      - 1.1.1.1
      - 9.9.9.9
    # Deliberately no cache volume, unlike tbm-exporter. That one caches its
    # *discovered layer configuration*; this exporter has no discovery step and
    # nothing to cache, and the level gauges must never be served from a stored
    # copy - a cached level would be exported as if it were a current reading.
    volumes:
      - ./scrapers/snowy_tantangara_exporter.py:/app/snowy_tantangara_exporter.py:ro
    networks: [monitoring]
    restart: unless-stopped
    # TCP probe only, same reasoning as tbm-exporter: /healthz triggers a real
    # upstream fetch, and the feed publishes once a day, so there is nothing to
    # learn from probing it every 30s.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 9110), 3).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  battery-exporter:
    image: python:3.12-alpine
    container_name: openelectricity-battery-exporter
    command:
      - python
      - /app/oe_battery_exporter.py
      - --listen-address=0.0.0.0
      - --port=9111
      # Hourly. 12 batteries = 12 data + 1 credit check = 13 requests/cycle
      # (14 on the once-daily cycle that also refreshes the fleet metadata), so
      # 313/day, inside the API's
      # 366 requests/day bucket. Both upstream metrics - stored energy and charge
      # /discharge power - come back in that one request per battery. Do NOT
      # shorten this to match the Prometheus scrape interval: the exporter
      # answers every scrape from its last completed cycle, so a 5m scrape of an
      # hourly poll costs the upstream nothing and buys no new data. See
      # scrapers/oe_battery_exporter.py for the budget arithmetic and NOTES.md
      # section 9.
      - --poll-interval=3600
      # 12 in scope + 1 /me per hourly cycle, +1 for the daily fleet refresh
      # = 313 requests/day against the plan's 366/day bucket. 2/s burst is held
      # by --request-interval. Being checked against the real dashboard.
      - --top=12
      - --fleet-cache-file=/cache/fleet.json
      # Persisted so a restart does not reset the 36h idle clock. Without it,
      # every unreadable battery gets a fresh reprieve on each deploy and the
      # rotation never converges. Liveness only - this file stores timestamps,
      # never a reading. The energy readings that --reading-cache-file below now
      # persists are a separate file with a separate justification.
      - --liveness-file=/cache/liveness.json
      # The overnight storage_battery reading, kept locally so the poll window
      # can be narrow instead of 192h.
      #
      # WHY: the exporter takes the newest non-null storage_battery sample
      # *inside the requested window*, and that reading is ~6-14h old at poll
      # time. So --lookback-hours=192 below is not headroom, it is the only way
      # to reach that one sample - and at interval=5m it costs 494 KB and ~13.6k
      # points for ONE facility, re-fetched hourly to pick up a handful of new
      # points. 12 facilities is ~5.9MB per cycle for data that is mostly
      # re-sent. Measured against the live API: 192h = 0.74s/facility, 2h =
      # 0.38s and identical resulting SoC.
      #
      # This file holds that reading per unit (one entry, ~400 bytes for the
      # 7 that publish), so a poll only has to cover the gap since the last one.
      # 2h against a 1h poll interval is 4x overlap, which is what makes the
      # narrow fetch safe: a dropped poll cannot open a hole.
      #
      # This DOES change a safety argument, unlike the liveness file, so it is
      # worth knowing: when a narrow window returns power but no storage point,
      # the cached reading is exported as the measured one rather than the metric
      # going blank. It keeps its own timestamp (oe_battery_sample_age_seconds
      # and oe_battery_anchor_age_hours report the true age - verified identical
      # to the wide path), and oe_batteries_reading_from_cache counts the units
      # in that state. It is NEVER used for a facility that failed to answer -
      # that stays scrape_success=0, because reporting a battery as monitored
      # during an upstream outage is the one thing this exporter must not do.
      #
      # The window goes wide again, automatically, if a unit that is *known* to
      # publish stops being reachable, if a poll was missed, or if the cache is
      # cold. A unit that has never published does not block narrowing - 5 of
      # the deployed 12 never do, and treating them as missing would pin the
      # window at 192h forever.
      - --reading-cache-file=/cache/readings.json
      - --poll-window-hours=2
      # Synthetic SOC by integrating power since the last measured reading.
      # Costs no extra requests: the full power series comes back in the same
      # response that was already being read for oe_battery_power_mw. Measured
      # metrics are untouched - inferred values are a separate metric family,
      # integrated from the last measured reading and published whenever an
      # anchor and power exist (see --infer-fresh-hours below, which no longer
      # gates this), which is what fills the daytime hours storage_battery does
      # not publish.
      - --enable-inferred
      # Resolution of that one request. A query parameter, so 5m costs exactly
      # what 1h costs - same endpoint, same request count, same credits - and it
      # is the single biggest accuracy lever there is: the hourly value is only
      # the arithmetic mean of the five-minute ones under it. Measured over four
      # days, 5m halves mean error at every horizon (0.40% vs 0.82% at 1h,
      # 1.47% vs 2.12% at 6h) and cuts saturation threefold at 8h.
      - --api-interval=5m
      # storage_battery publishes overnight only, so a measured reading is
      # ~14h old by the next nightfall - and that gap is precisely what power
      # integration exists to fill. Measured drift from the anchor, with 5m
      # power, is ~1.5% of capacity at 6h and ~5% by 14h. So inference runs the
      # whole way to the next reading rather than stopping at 6h: a continuous
      # curve is worth more than a short accurate one, and the accuracy is
      # reported alongside it (oe_battery_inferred_age_seconds, and the panel
      # description carries the error curve) rather than hidden. Expect a few
      # percent of drift late in the window, and more on the two units that
      # already saturate - see scrapers/NOTES.md.
      #
      # DEAD FLAG as of 2026-10-05: this no longer gates anything, by decision
      # rather than by accident. _measured_is_current has no callers and
      # _copy_of_measured is not on the poll path, so _compute_inferred
      # integrates whenever an anchor and power exist regardless of how fresh
      # the measured reading is.
      #
      # That was a choice between two test suites asserting opposite behaviour.
      # Always-integrate won: a copy makes the dashed line lie exactly on the
      # measured one and then bend away from it, it has to be replaced later
      # anyway, and its inferred_ts names a measurement rather than a power
      # sample, so the age metric would describe an integration that never
      # happened. The 3 copy tests were rewritten to the chosen semantics and the
      # full suite is green.
      #
      # Kept in the compose file so the dead path stays visible rather than
      # quietly rotting - anyone flipping inference back to copy semantics has to
      # come here and reconnect it deliberately. See NOTES.md, "Resolved:
      # always integrate, never copy a fresh reading".
      - --infer-fresh-hours=1
      # Anchor at most this far back. Sized for the NORMAL overnight gap (04:00
      # to 18:00 Sydney is 14h) so the dashed line runs continuously.
      #
      # 24 (default) -> 48 on 2026-10-03, when the anchor went 31.8h old and
      # inference refused outright. -> 336 on 2026-10-05, once the cause turned
      # out to be a feed that stopped publishing rather than one publishing late;
      # see the note on --lookback-hours below, which is what actually unblocked
      # it. 48h only bought two more days.
      #
      # The honest cost: past a few hours this is one long integral from a single
      # anchor, and the fit error in scrapers/NOTES.md (~1.5% of capacity at 6h,
      # ~5% at 14h) compounds well past that. At 90h of anchor age it is a
      # dead-reckoning, not a measurement, and it should be read as one. It is
      # clamped to [0, capacity] and saturation is published, so a drifted
      # estimate pins at a bound and says so rather than running away. Once
      # upstream publishes again the anchor refreshes and this is slack again -
      # drop it to 24 and the normal case is unaffected either way.
      - --max-infer-hours=192
      # Fetch and accept readings this far back. 192h = the API's 8-day maximum
      # at --api-interval=5m, so this is the widest window 5m can ask for.
      #
      # Raised from the 36h default on 2026-10-05. storage_battery stopped
      # publishing fleet-wide at 2026-10-02T04:00+10:00 - verified against the
      # API for ERB, WTAHB, LDBESS and SNB02, all with the same cut-off, so
      # three nights have published nothing. The exporter takes the newest
      # non-null sample *inside the requested window*
      # (oe_battery_exporter.py latest_sample), so a 36h lookback never even
      # fetched that last reading: scrape_success stayed 0, the inference anchor
      # was never seeded, and oe_batteries_inferred was 0 - inferred SOC vanished
      # from the dashboard entirely. These three flags are the whole fix, and
      # they have to move together: lookback fetches the reading, max-sample-age
      # stops it being discarded as stale on arrival, max-infer-hours allows
      # inference to integrate across the gap.
      #
      # Cost, stated plainly: the API caps the requested range by interval -
      # "Date range too large for 5m interval. Maximum range is 8 days." at
      # 9 days, HTTP 400, measured - so 192h is the widest 5m window that exists
      # and 336h is simply not fetchable. Verified: 5m 8d -> 200, 5m 9d -> 400;
      # 1h goes to 32d, so switching --api-interval to 1h buys 4x the reach at
      # roughly twice the inference error (scrapers/README.md has both curves).
      # 8 days of 5m is ~2300 points per metric per request (~245kB, 0.6s) and
      # free - the budget counts requests, not points.
      #
      # What it does weaken is the staleness signal: a feed that stops dead now
      # keeps publishing its last reading for 8 days instead of dropping its
      # series, so oe_battery_sample_age_seconds is now the only thing that
      # distinguishes "old" from "current". Read it.
      #
      # CLIFF: the anchor is 2026-10-02T04:00+10:00. When it passes 192h - about
      # 2026-10-10 - it falls out of this window and inferred SOC goes dark again
      # for the same reason it went dark this time. The power cache at 14d still
      # has the samples to integrate it; only the API's fetch window is short.
      # Options then: --api-interval=1h (32d window, more error), or a wider
      # --power-history-days plus nothing (does not help - the reading has to be
      # fetched from the API to exist as an anchor).
      - --lookback-hours=192
      - --max-sample-age=691200
      # Never integrate across a hole wider than this. Note this bounds holes in
      # *power*, which is continuous 24/7 - it is not the 14h daylight gap in
      # storage_battery, which is expected and is what --max-infer-hours covers.
      - --infer-max-gap-hours=2
      # Carry the newest power rate forward to scrape time, scaled by real
      # elapsed time, so the inferred line keeps moving between polls instead of
      # sitting on an hour-long plateau. Exactly integrating the samples gives a
      # staircase: the value is right but only changes when a new sample lands,
      # which on a chart reads as a battery that stopped. The hold is what the
      # next poll then re-anchors, so drift is bounded by the time to the next
      # real sample, not by the hold itself. Exported as
      # oe_battery_inferred_hold_hours so the extrapolated part is visible, and
      # the same capacity clamp applies - a held battery stops at full rather
      # than running off the panel. 6h is a backstop for a poll that stops
      # arriving; steady state is minutes.
      #
      # This flag did nothing until 2026-10-05: hold_rate=None was hardcoded at
      # both call sites while _hold_rate() sat unused above them. The symptom
      # was not subtle and not a display problem - Liddell sat at exactly
      # 483.417 MWh while discharging at 156 MW, because infer_soc is only exact
      # up to the newest power sample and that arrives with the hourly poll.
      # After wiring hold_rate through, Liddell falls 2.512 MWh/min against a
      # reported 150.76 MW. Do not remove this without re-reading that.
      - --infer-max-hold-hours=6
      # Share of grid-facing charging that actually reaches the cells; the rest
      # is conversion loss and never comes back out. Charging only - discharge
      # is already metered at the terminals - so this reads as a round-trip
      # figure: 100 MWh in, ~90 MWh back out. This is the one number in this
      # file that is an assumption about the hardware rather than something read
      # from the upstream, so it is stated here rather than defaulted into the
      # exporter. Validated on the live feed 2026-10-01: it cuts mean error
      # across the overnight gap from 11.3% to 7.4% of capacity and leaves
      # short windows unchanged. A per-unit value fitted over many nights would
      # be better than this constant.
      - --infer-charge-efficiency=0.9
      # Cache the per-unit power series locally so inferred SOC can integrate
      # across a restart or a failed scrape instead of quietly shortening the
      # window. This buys resilience, not accuracy. The inference *anchor* is still
      # re-read from the API on every start, so a restart can never serve a
      # stale SOC as current. At 5m resolution the file holds ~288 points per
      # unit per day, so 14 days of a 12-unit fleet is ~1MB rather than 11kB.
      # Defaults beside --fleet-cache-file; spelled out here because the cache
      # volume is what makes it survive a container rebuild.
      - --power-history-file=/cache/power-history.json
      - --power-history-days=14
      # Score 0.9 above against the fleet as it actually behaves. Every time a
      # reading supersedes an earlier one, the change between the two is real
      # measured ground truth and the power series in between says how much the
      # grid delivered and took, which is enough to solve for the loss term
      # instead of assuming it. Opt-in and read-only: the exporter publishes what
      # the evidence supports and never changes the flag above itself. The
      # evidence is deliberately slow to accumulate - a recommendation needs
      # enough independent pairs that a bad night cannot decide it - which is
      # appropriate, given that 0.9 was itself adopted on a sweep like this one
      # and then reverted.
      - --efficiency-calibration
      - --efficiency-calibration-file=/cache/efficiency-calibration.json
      - --efficiency-calibration-days=90
    environment:
      # Read from the environment by the exporter, never from argv, so the key
      # cannot show up in the process table or in a `docker inspect` command
      # line. It does land in the container's environment, which is why .env is
      # gitignored and .env.example is the tracked template.
      OPENEA_API_KEY: "${OPENEA_API_KEY:?set OPENEA_API_KEY in .env - see .env.example}"
    dns:
      - 1.1.1.1
      - 9.9.9.9
    volumes:
      - ./scrapers/oe_battery_exporter.py:/app/oe_battery_exporter.py:ro
      # A fleet-metadata cache and nothing else. Deliberately NOT the same
      # volume as tbm-exporter's: that one holds discovered ArcGIS layer
      # configuration, and two exporters sharing a volume means one of them
      # clobbering the other's file.
      - battery-fleet-cache:/cache
    networks: [monitoring]
    restart: unless-stopped
    # TCP probe, like the other two. /healthz on this exporter answers from the
    # last completed cycle and does not touch the API, but the health signal
    # here is deliberately about the process, not the upstream: this exporter
    # is *meant* to keep serving its last good reading through a transient API
    # failure, and a probe that went red on the upstream would fight that.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 9111), 3).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  aemobattery-exporter:
    image: python:3.12-alpine
    container_name: aemonemweb-battery-exporter
    command:
      - python
      - /app/aemo_battery_exporter.py
      - --listen-address=0.0.0.0
      - --port=9112
      # The archive publishes once a day (~04:11 AEST), so the poll cadence only
      # decides how quickly a new file is noticed - each unchanged check costs
      # one ~90 KB listing, and the ~126 MB zip is downloaded only when the
      # listing shows a file we do not already hold. --state-file is a restart
      # cache: the last processed report is reloaded only after the live listing
      # re-verifies that it is still the newest file, so a restart never forces
      # a 126 MB re-download and never serves an unverified file either (see
      # aemo_battery_report_reused).
      - --state-file=/cache/state.json
      # The intraday feed (Dispatch_SCADA + DispatchIS_Reports) publishes a tiny
      # file every 5-minute dispatch interval, so the default 300s cadence tracks
      # one interval per poll. These supply the live charge/discharge and
      # region-stored-MWh panels.
      - --intraday-poll-interval=300
      - --infer-state-file=/cache/intraday-state.json
      - --infer-charge-efficiency=1.0
    # Same resolver override as the other three exporters, for the same reason:
    # Docker's embedded resolver intermittently gives up with EAI_AGAIN, and the
    # fault is in the resolver, not the destination.
    dns:
      - 1.1.1.1
      - 9.9.9.9
    volumes:
      - ./scrapers/aemo_battery_exporter.py:/app/aemo_battery_exporter.py:ro
      # A state file and nothing else. NOT the battery-fleet-cache volume: two
      # exporters sharing a volume means one of them clobbering the other's file.
      - aemo-state:/cache
    networks: [monitoring]
    restart: unless-stopped
    # TCP probe only, same reasoning as the other exporters: /healthz answers
    # from the last completed cycle and probing the upstream every 30s would
    # hammer a listing that only changes once a day.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 9112), 3).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [monitoring]
    restart: unless-stopped
    depends_on:
      tbm-exporter:
        condition: service_healthy
      reservoir-exporter:
        condition: service_healthy
      battery-exporter:
        condition: service_healthy
      aemobattery-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Headless rendering, used to capture what a panel actually draws. The
      # renderer's own network name is the callback target, so the two must
      # share a network; the key is only trusted from inside the compose net.
      GF_RENDERING_SERVER_URL: "http://grafana-image-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
      # Grafana 13 renamed this from renderer_key to renderer_token; leaving it
      # at the default is a hard startup failure in production mode.
      GF_RENDERING_RENDERER_TOKEN: "${GRAFANA_RENDER_KEY:-local-render-key}"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks: [monitoring]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana-image-renderer:
    # Pinned by digest: this one is new, so there is no upgrade to opt into
    # later. Chromium needs more than the default 64MB of shared memory or it
    # dies mid-render, and --no-sandbox is required inside a container.
    image: grafana/grafana-image-renderer@sha256:76542ccc4c045e5ff9f80f87b25de6fcc71b31222172de5031a8ceba33772ee1
    container_name: grafana-image-renderer
    shm_size: "256mb"
    command: ["server", "--browser.sandbox=false"]
    # Must match Grafana's GF_RENDERING_RENDERER_TOKEN: the renderer rejects
    # anything without a matching X-Auth-Token, which is Grafana's half of the
    # shared secret, not a credential of its own.
    environment:
      AUTH_TOKEN: "${GRAFANA_RENDER_KEY:-local-render-key}"
    networks: [monitoring]
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  # external: reuse the volumes docker volume create already made, so existing
  # TSDB blocks and Grafana state survive the move into compose.
  prometheus-data:
    name: prometheus-data
    external: true
  grafana-storage:
